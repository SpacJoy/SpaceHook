# ==================== Gradle ====================
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ==================== Android ====================
android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
# 关闭 AGP 内置 Kotlin，改用显式声明的 Kotlin 插件版本，保证与 Miuix 的 Kotlin 2.4.20 对齐
android.builtInKotlin=false
# AGP 9 的新 DSL 与显式 kotlin.android 插件不兼容，需关掉 newDsl 才能用指定版本的 Kotlin
android.newDsl=false
# Miuix 传递依赖强制要求 compileSdk 37，AGP 9.1 尚未正式测试该版本，抑制警告
android.suppressUnsupportedCompileSdk=37.0

# ==================== Kotlin ====================
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m
